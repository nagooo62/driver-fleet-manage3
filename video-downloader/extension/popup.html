<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>محمّل الفيديوهات</title>
<style>
  body{margin:0;width:290px;font:14px/1.6 "Segoe UI",Tahoma,system-ui,sans-serif;background:#f4f6fb;color:#18202e}
  @media (prefers-color-scheme:dark){body{background:#161d2e;color:#e8ecf6}.b.s{background:#1f2842;color:#e8ecf6}}
  .w{padding:14px}h1{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .st{padding:8px 10px;border-radius:10px;background:#eef1fb;margin-bottom:10px;font-size:13px}
  @media (prefers-color-scheme:dark){.st{background:#1f2842}}
  .ok{color:#12a150;font-weight:700}.bad{color:#d92d20;font-weight:700}
  .b{width:100%;margin-top:8px;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#4f6df5,#7c4dff)}
  .b.s{background:#eef1fb;color:#18202e;font-weight:600}
</style></head>
<body><div class="w">
  <h1><img src="icons/icon32.png" width="22" height="22" alt=""> محمّل الفيديوهات</h1>
  <div class="st" id="st">جاري الفحص...</div>
  <button class="b" id="go">⬇ تحميل هذه الصفحة</button>
  <button class="b s" id="app">فتح البرنامج</button>
  <button class="b s" id="opt">⚙ خيارات الإضافة</button>
</div><script src="popup.js"></script></body></html>
