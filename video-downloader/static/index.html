<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محمّل الفيديوهات</title>
<style>
:root{
  --bg:#f4f6fb;--card:#fff;--text:#18202e;--muted:#667085;--line:#e3e8f0;
  --brand:#4f6df5;--brand2:#7c4dff;--ok:#12a150;--err:#d92d20;--warn:#b54708;
  --chip:#eef1fb;--bar:#e6eaf5;--shadow:0 6px 24px rgba(30,45,90,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1320;--card:#161d2e;--text:#e8ecf6;--muted:#93a0b8;--line:#25304a;
  --chip:#1f2842;--bar:#222c47;--shadow:0 6px 24px rgba(0,0,0,.35);--brand:#6b86ff}}
:root[data-theme=dark]{--bg:#0e1320;--card:#161d2e;--text:#e8ecf6;--muted:#93a0b8;--line:#25304a;
  --chip:#1f2842;--bar:#222c47;--shadow:0 6px 24px rgba(0,0,0,.35);--brand:#6b86ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-size:22px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
.sp{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
.icon-btn:hover{border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
textarea{resize:vertical;min-height:64px;direction:ltr;text-align:left}
textarea:focus,input:focus,select:focus{outline:2px solid var(--brand);outline-offset:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--chip);color:var(--text)}
.btn:hover:not(:disabled){filter:brightness(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-weight:600;font-size:13px}
.btn.danger{color:var(--err)}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer}
.hint{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.preview{display:flex;gap:14px;align-items:flex-start}
.thumb{width:190px;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:var(--chip);flex:none}
.pv-title{font-weight:700;font-size:16px;margin:0 0 4px;overflow-wrap:anywhere}
.step{display:flex;align-items:center;gap:8px;font-weight:700;margin:18px 0 8px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.tab.on{border-color:var(--brand);background:var(--chip)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--chip);color:var(--text);border-radius:12px;padding:9px 16px;cursor:pointer;font:inherit;font-size:14px;direction:rtl}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.note{background:var(--chip);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
.sect{display:flex;align-items:center;margin:22px 4px 10px}
.sect h2{font-size:16px;margin:0}
.job{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}
.job img:not([src]){visibility:hidden}
.job img{width:100px;aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:var(--chip)}
.j-title{font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.j-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{background:var(--chip);border-radius:6px;padding:0 7px}
.bar{height:8px;border-radius:99px;background:var(--bar);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s}
.job.done .bar i{background:var(--ok)} .job.error .bar i,.job.canceled .bar i{background:var(--err)}
.j-status{font-size:13px}
.done .j-status{color:var(--ok);font-weight:600} .error .j-status{color:var(--err)} .canceled .j-status{color:var(--warn)}
.j-err{color:var(--err);font-size:12.5px;overflow-wrap:anywhere;margin-top:4px}
.j-actions{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.j-actions:not(:has(.btn:not(.hidden))){display:none}
.j-actions .btn{width:100%;text-align:center}
.empty{text-align:center;color:var(--muted);padding:28px 10px;border:1px dashed var(--line);border-radius:14px}
dialog{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:20px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.f{margin-bottom:12px} .f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:fit-content;max-width:92vw;background:#222;color:#fff;border-radius:10px;padding:10px 16px;box-shadow:var(--shadow);z-index:9}
.toast.err{background:var(--err)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-inline-end:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:560px){.preview{flex-direction:column}.thumb{width:100%}.job{grid-template-columns:1fr}.job img{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">⬇</div>
    <div><h1>محمّل الفيديوهات</h1><div class="sub">يوتيوب · تيك توك · إنستغرام · فيسبوك · تويتر وأكثر من 1000 موقع</div></div>
    <div class="sp"></div>
    <button class="icon-btn" id="openFolder" title="فتح مجلد التحميلات">📂 المجلد</button>
    <button class="icon-btn" id="openSettings">⚙ الإعدادات</button>
  </header>

  <section class="card">
    <textarea id="urls" rows="2" placeholder="الصق رابط الفيديو هنا... (أو عدة روابط، كل رابط في سطر)" spellcheck="false" autofocus></textarea>
    <div class="row">
      <button class="btn primary" id="analyze">تحليل الرابط</button>
      <button class="btn" id="paste">📋 لصق</button>
      <label class="chk"><input type="checkbox" id="subs"> تحميل الترجمة (SRT)</label>
      <span class="sp"></span>
      <span class="hint" id="folderHint"></span>
    </div>
  </section>

  <section class="card hidden" id="result">
    <div class="preview">
      <img class="thumb" id="pvThumb" alt="" referrerpolicy="no-referrer">
      <div style="flex:1;min-width:0">
        <p class="pv-title" id="pvTitle"></p>
        <div class="sub" id="pvMeta"></div>
        <div class="hint" id="pvHint" style="margin-top:6px"></div>
      </div>
    </div>

    <div class="step"><b>1</b> ماذا تريد أن تحمّل؟</div>
    <div class="tabs">
      <button class="tab on" data-type="video">🎬 فيديو</button>
      <button class="tab" data-type="audio">🎧 صوت فقط</button>
    </div>

    <div class="step"><b>2</b> <span id="stepQ"></span></div>
    <div class="chips" id="chips"></div>
    <div class="note hidden" id="audioNote">تحويل MP3 لا يرفع الجودة فوق جودة الصوت الأصلية في المصدر. اختر «أعلى جودة أصلية» لحفظ الصوت كما هو بدون أي فقد.</div>

    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="startDl">⬇ ابدأ التحميل</button>
      <span class="hint" id="chosen"></span>
    </div>
  </section>

  <div class="sect"><h2>التحميلات</h2><span class="sp"></span>
    <button class="btn sm" id="clearDone">مسح المنتهية</button></div>
  <div id="jobs"></div>
  <div class="empty" id="empty">لا توجد تحميلات بعد. الصق رابطاً في الأعلى وابدأ.</div>
</div>

<dialog id="dlg">
  <h2 style="margin-top:0">الإعدادات</h2>
  <div class="f"><label>مجلد الحفظ</label><input type="text" id="sFolder" dir="ltr"></div>
  <div class="f"><label>عدد التحميلات المتزامنة</label><input type="number" id="sConc" min="1" max="6"></div>
  <div class="f"><label>حدّ السرعة (كيلوبايت/ثانية، 0 = بدون حد)</label><input type="number" id="sRate" min="0"></div>
  <div class="f"><label>كوكيز من المتصفح (للمحتوى الخاص أو المقيّد بالعمر)</label>
    <select id="sBrowser"><option value="">بدون</option><option>chrome</option><option>edge</option><option>firefox</option><option>brave</option><option>opera</option></select></div>
  <div class="f"><label>المظهر</label>
    <select id="sTheme"><option value="auto">تلقائي</option><option value="light">فاتح</option><option value="dark">داكن</option></select></div>
  <div class="f hint" id="ver"></div>
  <div class="row" style="margin-top:4px">
    <button class="btn primary" id="saveSet">حفظ</button>
    <button class="btn" id="closeSet">إغلاق</button>
    <button class="btn" id="upd">تحديث yt-dlp</button>
  </div>
</dialog>

<script>
const TOKEN="__TOKEN__";
const $=s=>document.querySelector(s);
async function api(p,body){
  const r=await fetch("/api/"+p,{method:body===undefined?"GET":"POST",headers:{"X-Token":TOKEN,"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||("خطأ "+r.status));
  return j;
}
function toast(m,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),err?6000:2800);}
const fmtDur=s=>{s=Math.round(s||0);if(!s)return"";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0");};
const fmtSpeed=b=>b?(b>=1048576?(b/1048576).toFixed(1)+" MB/s":Math.round(b/1024)+" KB/s"):"";
const fmtEta=s=>s?("متبقي "+Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0")):"";
const fmtSize=b=>!b?"":b>=1073741824?(b/1073741824).toFixed(2)+" GB":b>=1048576?(b/1048576).toFixed(1)+" MB":Math.round(b/1024)+" KB";

// ---------- التحليل واختيار النوع والجودة ----------
let cur=null;   // {urls,key,title,thumb}
let opts=null;  // {video:[[label,key]], audio:[[label,key]]}
let tab="video";
const VIDEO_PRESETS=[["أعلى جودة","best"],["1080p",1080],["720p",720],["480p",480],["360p",360]];
const AUDIO_PRESETS=[["أعلى جودة أصلية (بدون تحويل)","a_best"],["MP3 · 320 kbps","mp3_320"],["MP3 · 192 kbps","mp3_192"],["MP3 · 128 kbps","mp3_128"]];
function parseUrls(){
  return $("#urls").value.split(/\s+/).map(s=>s.trim()).filter(Boolean)
    .map(s=>/^https?:\/\//i.test(s)?s:(/^[\w-]+(\.[\w-]+)+\/?/.test(s)?"https://"+s:""))
    .filter(Boolean);
}
function setTab(t){
  tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.type===t));
  $("#stepQ").textContent=t==="video"?"اختر جودة الفيديو (المتاحة في هذا المقطع):":"اختر جودة الصوت:";
  $("#audioNote").classList.toggle("hidden",t!=="audio");
  const box=$("#chips");box.replaceChildren();
  (opts[t]||[]).forEach(([label,key],i)=>{
    const b=document.createElement("button");b.className="chip";b.textContent=label;
    b.onclick=()=>pick(b,label,key);box.append(b);
    if(i===0)pick(b,label,key);
  });
}
function pick(btn,label,key){
  cur.key=key;
  $("#chips").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===btn));
  $("#chosen").textContent="سيتم تحميل: "+(tab==="video"?"فيديو — ":"صوت — ")+label.split("·")[0].trim();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>opts&&setTab(b.dataset.type));
function showOptions(o){opts=o;setTab("video");$("#result").classList.remove("hidden");$("#result").scrollIntoView({behavior:"smooth",block:"nearest"});}

async function analyze(){
  const urls=parseUrls();
  if(!urls.length){toast("الصق رابطاً صحيحاً أولاً",true);return;}
  const btn=$("#analyze");btn.disabled=true;btn.innerHTML='<span class="spin"></span>جاري التحليل...';
  try{
    if(urls.length>1){
      cur={urls,key:"best",title:"",thumb:""};
      $("#pvThumb").classList.add("hidden");$("#pvTitle").textContent=urls.length+" روابط";
      $("#pvMeta").textContent="";$("#pvHint").textContent="الاختيار يُطبَّق على كل الروابط (إن لم تتوفر الجودة ينزل أقرب جودة).";
      showOptions({video:VIDEO_PRESETS,audio:AUDIO_PRESETS});
    }else{
      const info=await api("info",{url:urls[0]});
      if(info.type==="playlist"){
        cur={urls:info.urls,key:"best",title:"",thumb:""};
        $("#pvThumb").classList.add("hidden");$("#pvTitle").textContent=info.title;
        $("#pvMeta").textContent=info.count+" فيديو"+(info.uploader?" · "+info.uploader:"");
        $("#pvHint").textContent="قائمة تشغيل: سيُنزَّل كل محتواها بالاختيار أدناه.";
        showOptions({video:VIDEO_PRESETS,audio:AUDIO_PRESETS});
      }else{
        cur={urls:[urls[0]],key:"best",title:info.title,thumb:info.thumbnail};
        const im=$("#pvThumb");im.classList.toggle("hidden",!info.thumbnail);im.src=info.thumbnail||"";im.onerror=()=>im.classList.add("hidden");
        $("#pvTitle").textContent=info.title;
        $("#pvMeta").textContent=[info.uploader,fmtDur(info.duration)].filter(Boolean).join(" · ");
        $("#pvHint").textContent="";
        showOptions({video:info.qualities.map(q=>[q.label,q.key]),audio:info.audio.map(q=>[q.label,q.key])});
      }
    }
  }catch(e){toast(e.message,true);}
  finally{btn.disabled=false;btn.textContent="تحليل الرابط";}
}
async function startDl(){
  if(!cur)return;
  const b=$("#startDl");b.disabled=true;
  try{
    await api("download",{urls:cur.urls,key:cur.key,title:cur.title,thumb:cur.thumb,subs:tab==="video"&&$("#subs").checked});
    toast("أُضيف للتحميل ✔");$("#result").classList.add("hidden");$("#urls").value="";cur=null;opts=null;refresh();
  }catch(e){toast(e.message,true);}
  finally{b.disabled=false;}
}
$("#analyze").onclick=analyze;
$("#startDl").onclick=startDl;
$("#paste").onclick=async()=>{try{$("#urls").value=await navigator.clipboard.readText();analyze();}catch{toast("اضغط Ctrl+V داخل المربع",true);}};
$("#urls").addEventListener("paste",()=>setTimeout(()=>{if(parseUrls().length===1)analyze();},50));
$("#urls").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&parseUrls().length<=1){e.preventDefault();analyze();}});

// ---------- قائمة التحميلات ----------
const els=new Map();
const STAT={queued:"في الانتظار",downloading:"جاري التحميل",processing:"جاري الدمج والمعالجة...",done:"تم التحميل ✔",error:"فشل",canceled:"أُلغي"};
function mkJob(j){
  const d=document.createElement("div");d.className="job";
  d.innerHTML='<img alt="" referrerpolicy="no-referrer"><div><div class="j-title"></div><div class="j-meta"><span class="badge"></span><span class="m-sp"></span></div><div class="bar"><i></i></div><div class="j-status"></div><div class="j-err"></div></div><div class="j-actions"></div>';
  const act=d.querySelector(".j-actions");
  const mk=(t,cls,fn)=>{const b=document.createElement("button");b.className="btn sm "+cls;b.textContent=t;b.onclick=fn;act.append(b);return b;};
  const open=mode=>api("open",{id:j.id,mode}).catch(e=>toast(e.message,true));
  d._play=mk("▶ فتح الملف","primary",()=>open("file"));
  d._folder=mk("📂 فتح المجلد","",()=>open("folder"));
  d._cancel=mk("✖ إلغاء","danger",()=>api("cancel",{id:j.id}).then(refresh));
  d._retry=mk("↻ إعادة المحاولة","",()=>{api("download",{urls:[d._url],key:d._key}).then(()=>api("remove",{id:j.id})).then(refresh);});
  d._rm=mk("🗑 حذف من القائمة","",()=>api("remove",{id:j.id}).then(refresh));
  d.querySelector("img").onerror=e=>e.target.style.visibility="hidden";
  return d;
}
function upd(d,j){
  d._url=j.url;d._key=j.key;
  d.className="job "+j.status;
  const im=d.querySelector("img");if(j.thumb&&im.getAttribute("src")!==j.thumb){im.src=j.thumb;im.style.visibility="visible";}
  d.querySelector(".j-title").textContent=j.title;
  d.querySelector(".badge").textContent=j.label;
  d.querySelector(".m-sp").textContent=j.status==="done"?fmtSize(j.size):[fmtSpeed(j.speed),fmtEta(j.eta)].filter(Boolean).join(" · ");
  d.querySelector(".bar i").style.width=(j.status==="done"?100:j.pct)+"%";
  d.querySelector(".j-status").textContent=(STAT[j.status]||j.status)+(j.status==="downloading"?" "+Math.round(j.pct)+"%":"");
  d.querySelector(".j-err").textContent=j.error||"";
  const active=["queued","downloading","processing"].includes(j.status);
  d._cancel.classList.toggle("hidden",!active||j.status==="processing");
  d._play.classList.toggle("hidden",j.status!=="done");
  d._folder.classList.toggle("hidden",j.status!=="done");
  d._retry.classList.toggle("hidden",!["error","canceled"].includes(j.status));
  d._rm.classList.toggle("hidden",active);
}
async function refresh(){
  try{
    const {jobs}=await api("jobs");const box=$("#jobs");const seen=new Set();
    jobs.forEach((j,i)=>{
      seen.add(j.id);let d=els.get(j.id);
      if(!d){d=mkJob(j);els.set(j.id,d);}
      upd(d,j);
      if(box.children[i]!==d)box.insertBefore(d,box.children[i]||null);
    });
    for(const [id,d] of els)if(!seen.has(id)){d.remove();els.delete(id);}
    $("#empty").classList.toggle("hidden",jobs.length>0);
  }catch(e){}
}
setInterval(refresh,800);refresh();
$("#clearDone").onclick=()=>api("clear",{}).then(refresh);
$("#openFolder").onclick=()=>api("open",{}).catch(e=>toast(e.message,true));

// ---------- الإعدادات ----------
function applyTheme(t){const r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);try{localStorage.setItem("theme",t);}catch{}}
try{applyTheme(localStorage.getItem("theme")||"auto");}catch{}
async function loadSettings(){
  const {settings:s,version,ffmpeg}=await api("settings");
  $("#sFolder").value=s.folder;$("#sConc").value=s.concurrent;$("#sRate").value=s.rate_kb;$("#sBrowser").value=s.browser;
  try{$("#sTheme").value=localStorage.getItem("theme")||"auto";}catch{}
  $("#subs").checked=!!s.subs;$("#folderHint").textContent="الحفظ في: "+s.folder;
  $("#ver").textContent="yt-dlp "+version+(ffmpeg?" · ffmpeg ✔":" · ffmpeg غير موجود ✖");
}
$("#openSettings").onclick=async()=>{await loadSettings();$("#dlg").showModal();};
$("#closeSet").onclick=()=>$("#dlg").close();
$("#saveSet").onclick=async()=>{
  try{
    await api("settings",{folder:$("#sFolder").value,concurrent:+$("#sConc").value||2,rate_kb:+$("#sRate").value||0,browser:$("#sBrowser").value,subs:$("#subs").checked});
    applyTheme($("#sTheme").value);await loadSettings();$("#dlg").close();toast("تم الحفظ ✔");
  }catch(e){toast(e.message,true);}
};
$("#subs").onchange=()=>api("settings",{subs:$("#subs").checked}).catch(()=>{});
$("#upd").onclick=async()=>{const b=$("#upd");b.disabled=true;b.textContent="جاري التحديث...";
  try{toast((await api("update",{})).message);}catch(e){toast(e.message,true);}
  b.disabled=false;b.textContent="تحديث yt-dlp";};
loadSettings().catch(()=>{});
setInterval(()=>api("ping").catch(()=>{}),5000);
</script>
</body>
</html>
