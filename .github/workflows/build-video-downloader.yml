name: Build Video Downloader (Windows)

on:
  push:
    paths:
      - "video-downloader/**"
      - ".github/workflows/build-video-downloader.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: video-downloader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build app (PyInstaller)
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --windowed --python-option "X utf8" --name VideoDownloader --icon assets\app.ico
          --add-data "static;static" --add-data "extension;extension"
          --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg --collect-all curl_cffi
          --collect-data certifi --collect-submodules pystray --exclude-module tkinter app.py

      - name: Smoke test (start the built app and check it serves the UI)
        shell: pwsh
        env:
          VD_NO_BROWSER: "1"
          VD_PORT: "8799"
        run: |
          $env:VD_HOME = Join-Path $env:RUNNER_TEMP "vdhome"
          $p = Start-Process -FilePath ".\dist\VideoDownloader\VideoDownloader.exe" -ArgumentList "--background" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8799/" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200 -and $r.Content -match 'ui-version') { $ok = $true; break }
            } catch {}
          }
          $log = Join-Path $env:VD_HOME "log.txt"
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 20 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The built app did not serve the UI" }
          Write-Host "Smoke test passed"

      - name: Arabic-path test (run the built app from an Arabic-named folder and make a real HTTPS request)
        shell: pwsh
        env:
          VD_NO_BROWSER: "1"
          VD_PORT: "8798"
          VD_DIAG_BASELINE: "https://pypi.org/"
        run: |
          $ar = -join ([char[]](0x0631,0x0648,0x0627,0x0626,0x0633))
          $root = "C:\$ar test"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -Recurse -Force "dist\VideoDownloader" "$root\app"
          $env:VD_HOME = "$root\data"
          $p = Start-Process -FilePath "$root\app\VideoDownloader.exe" -ArgumentList "--background" -PassThru
          $html = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $html = (Invoke-WebRequest -Uri "http://127.0.0.1:8798/" -UseBasicParsing -TimeoutSec 3).Content; break } catch {}
          }
          if (-not $html) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "the app did not start from an Arabic path" }
          $tok = [regex]::Match($html, 'const TOKEN="([^"]+)"').Groups[1].Value
          $res = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8798/api/diagnose" -Headers @{ "X-Token" = $tok } -ContentType "application/json" -Body '{"url":"https://github.com/"}' -TimeoutSec 120
          $res.checks | ForEach-Object { "{0}: {1} | {2}" -f $_.name, $_.state, $_.detail }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          $bad = @($res.checks | Where-Object { $_.state -eq "fail" })
          if ($bad.Count -gt 0) { throw "an HTTPS request failed when the app runs from an Arabic path" }
          Write-Host "Arabic-path HTTPS test passed"

      - name: Restart test (the packaged app must come back with a new process after /api/restart)
        shell: pwsh
        env:
          VD_NO_BROWSER: "1"
          VD_PORT: "8797"
        run: |
          $env:VD_HOME = Join-Path $env:RUNNER_TEMP "vdhome-restart"
          $p = Start-Process -FilePath ".\dist\VideoDownloader\VideoDownloader.exe" -ArgumentList "--background" -PassThru
          function Get-Settings {
            try {
              $html = (Invoke-WebRequest -Uri "http://127.0.0.1:8797/" -UseBasicParsing -TimeoutSec 3).Content
              $tok = [regex]::Match($html, 'const TOKEN="([^"]+)"').Groups[1].Value
              return Invoke-RestMethod -Uri "http://127.0.0.1:8797/api/settings" -Headers @{ "X-Token" = $tok } -TimeoutSec 5
            } catch { return $null }
          }
          $s1 = $null
          for ($i = 0; $i -lt 60 -and -not $s1; $i++) { Start-Sleep -Seconds 1; $s1 = Get-Settings }
          if (-not $s1) { throw "app did not start" }
          $html = (Invoke-WebRequest -Uri "http://127.0.0.1:8797/" -UseBasicParsing).Content
          $tok = [regex]::Match($html, 'const TOKEN="([^"]+)"').Groups[1].Value
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8797/api/restart" -Headers @{ "X-Token" = $tok } -ContentType "application/json" -Body "{}" | Out-Null
          Start-Sleep -Seconds 3
          $s2 = $null
          for ($i = 0; $i -lt 60 -and (-not $s2 -or $s2.pid -eq $s1.pid); $i++) { Start-Sleep -Seconds 1; $s2 = Get-Settings }
          Write-Host ("pid before: {0} | pid after: {1}" -f $s1.pid, $s2.pid)
          Get-Process -Name VideoDownloader -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $s2 -or $s2.pid -eq $s1.pid) { throw "the app did not come back after restart" }
          Write-Host "Restart test passed"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (Setup.exe)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\VideoDownloader.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Setup
          path: video-downloader/dist-installer/VideoDownloader-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-portable
          path: video-downloader/dist/VideoDownloader
